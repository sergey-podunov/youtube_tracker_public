name: Update Image Tag

on:
  push:
    tags:
      - 'default-v*'
      - 'prod-v*'

jobs:
  update-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          ENV=$(echo "$TAG" | sed 's/-v.*//')
          VERSION=$(echo "$TAG" | sed 's/^[a-z]*-//')
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed: env=$ENV, version=$VERSION"

      - name: Update kustomization.yaml image tag
        run: |
          ENV="${{ steps.parse.outputs.env }}"
          VERSION="${{ steps.parse.outputs.version }}"
          KUSTOMIZATION_FILE="k8s/overlays/${ENV}/kustomization.yaml"

          if [ ! -f "$KUSTOMIZATION_FILE" ]; then
            echo "Error: $KUSTOMIZATION_FILE not found"
            exit 1
          fi

          sed -i "s/newTag: .*/newTag: ${VERSION}/" "$KUSTOMIZATION_FILE"

          echo "Updated $KUSTOMIZATION_FILE:"
          cat "$KUSTOMIZATION_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ steps.parse.outputs.env }}/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update ${{ steps.parse.outputs.env }} image tag to ${{ steps.parse.outputs.version }}"
          git push origin main