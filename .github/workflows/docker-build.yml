name: Build and Push Docker Image

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    tags:
      - 'v*'
      - 'default-v*'
      - 'prod-v*'
      - 'prod-[0-9]*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # For env-prefixed tags like prod-v2.0.0 or prod-2.0.0, extract the version part
            type=match,pattern=\w+-v(.*),group=1
            type=match,pattern=prod-(\d.*),group=1
            # For pull requests, use pr-<PR_NUMBER>-<RUN_NUMBER> as a unique build identifier
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.run_number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}

      - name: Set BUILD_TAG environment variable
        id: set_build_tag
        run: |
          BUILD_TAG_VALUE="${{ github.sha }}" # Default to commit SHA
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Align BUILD_TAG with the Docker image tag for PRs
            BUILD_TAG_VALUE="pr-${{ github.event.pull_request.number }}-${{ github.run_number }}"
          elif [[ "${{ github.ref }}" == refs/tags/*-v* || "${{ github.ref }}" == refs/tags/prod-[0-9]* ]]; then
            # Extract version from env-prefixed tag (e.g., prod-v2.0.0 or prod-2.0.0 -> 2.0.0)
            BUILD_TAG_VALUE=$(echo "${{ github.ref_name }}" | sed 's/^[a-z]*-//' | sed 's/^v//')
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TAG_VALUE="${{ github.ref_name }}" # Use the Git tag if it's a version release
          fi
          echo "BUILD_TAG=$BUILD_TAG_VALUE" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false
          # Pass the BUILD_TAG as a build argument to the Dockerfile
          build-args: BUILD_TAG=${{ env.BUILD_TAG }}
