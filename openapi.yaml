openapi: 3.0.0
info:
  title: Book API
  description: API for retrieving information about books
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /statistics/generate:
    post:
      description: Initiate statistics generation
      responses:
        202:
          description: Task started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatGenerationStarted'

  /books/{id}:
    get:
      summary: Get a book by ID
      description: Returns a single book object by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID of the book to retrieve
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
          content: {}
components:
  schemas:
    StatGenerationStarted:
      description: Generation started
      type: object
      required:
        - statusPath
      properties:
        statusPath:
          type: string
          description: path for requests about status of the generation task
          example: /statistics/job/1
    Book:
      type: object
      required:
        - id
        - title
        - author
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the book
        title:
          type: string
          description: Title of the book
        author:
          type: string
          description: Author of the book
