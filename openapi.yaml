openapi: 3.0.0
info:
  title: Book API
  description: API for retrieving information about books
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /status:
    get:
      summary: current service state
      description: Returns a Status object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /youtube/channel:
    post:
      description: Store new Youtube channel
      requestBody:
        description: Payload for example
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YoutubeChannel'
      responses:
        201:
          description: Successfully stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeChannel'
  /youtube/channel/{id}:
    get:
      summary: Get Youtube Channel by ID
      description: Returns a YoutubeChannel object by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID of the channel
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeChannel'
        '404':
          description: Not found
          content: {}
  /statistics/generate:
    post:
      description: Initiate statistics generation
      responses:
        202:
          description: Task started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatGenerationStarted'
components:
  schemas:
    Status:
      description: Service status
      type: object
      properties:
        uptime:
          type: string
    YoutubeChannel:
      description: Youtube Channel
      type: object
      required:
        - name
        - youtube_id
      properties:
        id:
          type: integer
          format: int64
          description: internal id
        name:
          type: string
          description: channel name
        youtube_id:
          type: string
          description: youtube uniq
        created_at:
          type: string
    StatGenerationStarted:
      description: Generation started
      type: object
      required:
        - statusPath
      properties:
        statusPath:
          type: string
          description: path for requests about status of the generation task
          example: /statistics/job/1
