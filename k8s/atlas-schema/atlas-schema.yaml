apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: psdb-atlas
spec:
  urlFrom:
    secretKeyRef:
      key: atlas-url
      name: postgres-secret-config
  schema:
    sql: |
      CREATE SCHEMA IF NOT EXISTS youtube_tracker;

      CREATE table youtube_tracker.session (
          "id" text NOT NULL,
          "user_id" text NOT NULL,
          "expire_at" timestamp NOT NULL,
          PRIMARY KEY ("id")
      );
      CREATE TABLE youtube_tracker.youtube_channel (
          youtube_channel_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          external_id VARCHAR(125) NOT NULL,
          channel_name TEXT NOT NULL,
          created_at TIMESTAMP WITHOUT TIME ZONE,
          checked_at TIMESTAMP WITHOUT TIME ZONE
      );
      CREATE TABLE youtube_tracker.youtube_channel_stat (
          youtube_channel_stat_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          youtube_channel_id BIGINT NOT NULL,
          created_at TIMESTAMP WITHOUT TIME ZONE NOT NULL,
          subscribers_count BIGINT NOT NULL,
          FOREIGN KEY (youtube_channel_id) REFERENCES youtube_tracker.youtube_channel (youtube_channel_id)
      );
  policy:
    lint:
      destructive:
        error: false
    diff:
      skip:
        drop_column: false