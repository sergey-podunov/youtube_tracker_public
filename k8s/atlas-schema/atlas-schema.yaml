apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: psdb-atlas
spec:
  urlFrom:
    secretKeyRef:
      key: atlas-url
      name: postgres-secret-config
  schema:
    sql: |
      CREATE SCHEMA IF NOT EXISTS youtube_tracker;

      CREATE TABLE youtube_tracker.youtube_channel (
          youtube_channel_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          external_id VARCHAR(125) NOT NULL,
          title TEXT NOT NULL,
          custom_url VARCHAR(125),
          description TEXT,
          published_at TIMESTAMP WITHOUT TIME ZONE,
          created_at TIMESTAMP WITHOUT TIME ZONE,
          checked_at TIMESTAMP WITHOUT TIME ZONE
      );
      CREATE TABLE youtube_tracker.youtube_channel_stat (
          youtube_channel_stat_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          youtube_channel_id BIGINT NOT NULL,
          created_at TIMESTAMP WITHOUT TIME ZONE NOT NULL,
          subscribers_count BIGINT NOT NULL,
          view_count BIGINT NOT NULL,
          video_count BIGINT NOT NULL,
          FOREIGN KEY (youtube_channel_id) REFERENCES youtube_tracker.youtube_channel (youtube_channel_id)
      );
      CREATE TABLE youtube_tracker.youtube_video (
          youtube_video_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          youtube_channel_id BIGINT NOT NULL,
          external_id VARCHAR(125) NOT NULL UNIQUE,
          title TEXT NOT NULL,
          published_at TIMESTAMP WITHOUT TIME ZONE,
          created_at TIMESTAMP WITHOUT TIME ZONE,
          checked_at TIMESTAMP WITHOUT TIME ZONE,
          FOREIGN KEY (youtube_channel_id) REFERENCES youtube_tracker.youtube_channel (youtube_channel_id)
      );
      CREATE TABLE youtube_tracker.youtube_video_stat (
          youtube_video_stat_id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          youtube_video_id BIGINT NOT NULL,
          created_at TIMESTAMP WITHOUT TIME ZONE NOT NULL,
          view_count BIGINT NOT NULL,
          like_count BIGINT NOT NULL,
          comment_count BIGINT NOT NULL,
          FOREIGN KEY (youtube_video_id) REFERENCES youtube_tracker.youtube_video (youtube_video_id)
      );
  policy:
    lint:
      destructive:
        error: false
    diff:
      skip:
        drop_column: false
