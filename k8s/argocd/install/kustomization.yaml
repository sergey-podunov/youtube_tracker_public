apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.3/manifests/install.yaml

patches:
  # Reduce resource requests for all ArgoCD components
  - target:
      kind: Deployment
      namespace: argocd
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 50Mi
          limits:
            ephemeral-storage: 200Mi
  - target:
      kind: StatefulSet
      namespace: argocd
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 50Mi
          limits:
            ephemeral-storage: 200Mi
  # Disable unnecessary components
  - target:
      kind: Deployment
      name: argocd-dex-server
      namespace: argocd
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
      namespace: argocd
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-notifications-controller
      namespace: argocd
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0