apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:sergey-podunov/youtube_tracker.git
    targetRevision: main
    path: k8s/infrastructure/overlays/default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true