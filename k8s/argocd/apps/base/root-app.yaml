apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: youtube-tracker-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:sergey-podunov/youtube_tracker.git
    targetRevision: main
    path: k8s/argocd/templates/overlays/default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true